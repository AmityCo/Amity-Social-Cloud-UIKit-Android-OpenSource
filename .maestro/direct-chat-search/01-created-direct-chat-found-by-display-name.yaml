# PDT-6120: a direct chat created on Android must be found by the other user's display name.
#
# Account: -e USER_ID=arezy   Other user: -e TARGET_NAME=iii (display name; its userId is tee2).
# Search term: -e SEARCH_TERM=iii (the display name). Use tee2 (the userId) as a control.
# Before the fix, Android sent displayName = userId in the create request, so the chat matched
# "tee2" and not "iii". The assertion at the end fails before the fix and passes after it.
#
# Coordinates are percentages of the screen so they hold on any emulator size:
#   +  button on the chat home      81%,9%
#   search button on the chat home  71%,9%
#   search field on New Conversation 50%,15%
#   first user row                  20%,22%
appId: com.amity.sample.ascuikit
---
- runFlow: ../channel-sort/00-login.yaml
- tapOn: "Chat"
- tapOn: "Chat V4"
- extendedWaitUntil:
    visible: "Direct"
    timeout: 40000

# ---- create the direct chat ----
- tapOn:
    point: "81%,9%"
- tapOn: "Direct chat"
- extendedWaitUntil:
    visible: "New Conversation"
    timeout: 15000
- tapOn:
    point: "50%,15%"
- inputText: "${TARGET_NAME}"
# "${TARGET_NAME}" is also the text typed in the search field, so it cannot show that the result
# list has refreshed. Wait for another row of the same search (staging seed user) instead.
- extendedWaitUntil:
    visible: ".*Nikolaus III.*"
    timeout: 20000
# The exact-name match is the first row.
- tapOn:
    point: "20%,22%"
# The composer placeholder is not exposed to Maestro. Wait until the chat page replaces the picker.
- extendedWaitUntil:
    notVisible: "New Conversation"
    timeout: 30000
- takeScreenshot: 01-chat-created

# ---- back to the chat list ----
# The chat is listed without a message, so no message is needed for the search check.
- back
- extendedWaitUntil:
    visible: "Direct"
    timeout: 20000

# ---- search the chat list by the display name ----
- tapOn:
    point: "71%,9%"
- inputText: "${SEARCH_TERM}"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 15000
# Give the server search time to answer before judging the screen.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-search-result
- assertNotVisible: "No results found"
