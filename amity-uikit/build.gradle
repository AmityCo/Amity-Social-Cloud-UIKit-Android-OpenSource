plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.kapt'
}

apply from: "../buildsystem/activity.gradle"

// The short SHA of the checkout this artifact was built from. Guarded: a consumer building from
// a source archive, or any tree without git, has no .git to ask -- that must degrade, not fail.
static def resolveGitCommitHash() {
    try {
        def proc = ["git", "rev-parse", "--short=8", "HEAD"].execute(null, new File("."))
        proc.waitForOrKill(3000)
        return proc.exitValue() == 0 ? proc.text.trim() : "unknown"
    } catch (Exception ignored) {
        return "unknown"
    }
}

android {
    namespace 'com.amity.socialcloud.uikit'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        buildConfigField "String", "AMITY_UIKIT_VERSION", "\"${amityUIKitVersion}\""
        buildConfigField "String", "AMITY_UIKIT_COMMIT_HASH", "\"${resolveGitCommitHash()}\""
    }

    buildTypes {
        release {
            consumerProguardFiles 'amity-proguard-rules.pro'
        }
        debug {
            consumerProguardFiles 'amity-proguard-rules.pro'
        }
    }
    packagingOptions {
        pickFirst("META-INF/*.kotlin_module")
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    api project(path: ':social-compose')
    api project(path: ':chat-compose')
    // AmityUIKitFeature is the argument type of a public method on
    // AmityUIKit4Manager, so it has to be on a consumer's compile classpath from
    // this module's own declaration. It reaches one today only because
    // chat-compose happens to use `api project(':common-compose')` where
    // social-compose uses `implementation` — a public type must not depend on
    // another module's choice.
    api project(path: ':common-compose')

    api "$amitySDKDependency:amity-sdk:$amityMessagingSdkVersion"
    // Previously reached transitively via the v3 :social module's api deps.
    api "$amitySDKDependency:amity-video-publisher:$amityMessagingSdkVersion"
    api "$amitySDKDependency:amity-video-player:$amityMessagingSdkVersion"
}